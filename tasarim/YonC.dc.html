  <div style="position:absolute; left:0; top:720px; width:1280px; height:80px; background:#17140f; display:flex; align-items:center; gap:24px; padding:0 28px; box-sizing:border-box;">
    <div style="color:#e0bc60; font-size:26px; font-weight:700;">C · Akşam Güneşi</div>
    <div style="color:#efe9dc; font-size:16px; line-height:1.45; max-width:820px;">
      <strong>Tek yönlü ışık.</strong> Her nesnenin aynı yöne düşen uzun gölgesi var, güneşe bakan yüzler sıcak, ters yüzler soğuk; uzak plan pusa gömülür. Duygusu en güçlü olan, çiftler için en “bizim yerimiz” hissini veren yön.
