      Kilitli bölge silik durur ve seviye rozeti taşır; spec'in 0:30 anı (“sadece Ev aktif, diğer 6 silik”) üstteki
      <strong>seviye</strong> ayarını 1 yaparak görülür.
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"seviye":{"editor":"range","default":9,"min":1,"max":12,"step":1,"section":"Durum"}}'>
class Component extends DCLogic {
  renderVals() {
    const sv = this.props.seviye ?? 9;

    // Spec B.4: her bolgenin kendi acilis seviyesi var. Kilitliyse silik
    // durur ve rozetinde gereken seviye yazar — "neden giremiyorum" sorusu
    // haritada cevaplanir, red mesajinda degil.
    const bolge = (gereken) => {
      const acik = sv >= gereken;
      return {
        op: acik ? 1 : 0.32,
        etiket: acik ? 1 : 0.75,
        rozet: acik ? '#84b060' : '#e0bc60',
        sv: acik ? '✓' : String(gereken)
      };
    };

    return {
      seviye: sv,
      xpEn: 40 + (sv % 5) * 24,
      ogretici: sv <= 1 ? 1 : 0,
      ev: bolge(1),
      tarla: bolge(1),
      depo: bolge(2),
      tren: bolge(5),
      market: bolge(6),
      orman: bolge(7),
      maden: bolge(9)
    };
  }
}
</script>
